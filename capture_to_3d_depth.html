<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Capture-to-3D — Depth Relief</title>
<style>
  body { margin: 0; background: #0a0f0d; overflow: hidden; font-family: 'IBM Plex Mono', monospace; }
  #ui { position: absolute; top: 14px; left: 16px; color: #35a897; font-size: 0.8rem; letter-spacing: 1px; z-index: 10; text-transform: uppercase; }
  #hint { position: absolute; bottom: 14px; left: 16px; color: #6b7a76; font-size: 0.68rem; z-index: 10; }
  #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); color: #35a897; font-size: 0.8rem; z-index: 20; }
</style>
</head>
<body>
<div id="ui">CAPTURE-TO-3D · DEPTH RELIEF (FIRST PASS)</div>
<div id="hint">Drag to orbit · right-click drag (or shift+drag) to pan · scroll to zoom · relief generated from photo luminance</div>
<div id="loading">Building relief mesh…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const PHOTO = "katas_raj_1.webp"; 

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0f0d);
scene.fog = new THREE.Fog(0x0a0f0d, 6, 16);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 3.2, 5.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0x9fe8da, 1.1);
key.position.set(3, 6, 4);
scene.add(key);
const rim = new THREE.PointLight(0x35a897, 0.8);
rim.position.set(-4, 2, -3);
scene.add(rim);

// Faint scan-grid floor for lab/survey feel
const grid = new THREE.GridHelper(14, 28, 0x1f3d38, 0x14231f);
grid.position.y = -1.4;
scene.add(grid);

// Soft radial contact shadow so the mesh reads as resting in the scene, not floating above it
const shadowCanvas = document.createElement("canvas");
shadowCanvas.width = 256; shadowCanvas.height = 256;
const shadowCtx = shadowCanvas.getContext("2d");
const grad = shadowCtx.createRadialGradient(128, 128, 0, 128, 128, 128);
grad.addColorStop(0, "rgba(0,0,0,0.45)");
grad.addColorStop(1, "rgba(0,0,0,0)");
shadowCtx.fillStyle = grad;
shadowCtx.fillRect(0, 0, 256, 256);
const shadowTexture = new THREE.Texture(shadowCanvas);
shadowTexture.needsUpdate = true;
const shadowMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(6, 6),
  new THREE.MeshBasicMaterial({ map: shadowTexture, transparent: true, depthWrite: false })
);
shadowMesh.rotation.x = -Math.PI / 2;
shadowMesh.position.y = -1.39;
scene.add(shadowMesh);

const rig = new THREE.Group();
scene.add(rig);

const img = new Image();
img.crossOrigin = "anonymous";
img.onload = () => {
  const w = 160, h = Math.round(160 * img.height / img.width);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;

  // Raw per-pixel luminance is noisy — displacing geometry directly from it
  // produces a jittery, static-like bump surface instead of a clean relief.
  // Fix: compute luminance, then box-blur it before using it as depth.
  // The photo texture (applied separately below at full resolution) stays sharp;
  // only the underlying geometry is smoothed.
  const lum = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const idx = i * 4;
    lum[i] = (data[idx] * 0.299 + data[idx+1] * 0.587 + data[idx+2] * 0.114) / 255;
  }
  const radius = 2;
  const smoothed = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      let sum = 0, count = 0;
      for (let dy = -radius; dy <= radius; dy++) {
        for (let dx = -radius; dx <= radius; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx >= 0 && nx < w && ny >= 0 && ny < h) { sum += lum[ny * w + nx]; count++; }
        }
      }
      smoothed[y * w + x] = sum / count;
    }
  }

  const geo = new THREE.PlaneGeometry(4.6, 4.6 * h / w, w - 1, h - 1);
  const pos = geo.attributes.position;

  for (let i = 0; i < pos.count; i++) {
    pos.setZ(i, smoothed[i] * 0.9); // displacement = smoothed "depth"
  }
  geo.computeVertexNormals();

  const texture = new THREE.Texture(canvas);
  texture.needsUpdate = true;
  const fullResCanvas = document.createElement("canvas");
  fullResCanvas.width = img.width; fullResCanvas.height = img.height;
  fullResCanvas.getContext("2d").drawImage(img, 0, 0);
  const fullTexture = new THREE.Texture(fullResCanvas);
  fullTexture.needsUpdate = true;

  const mat = new THREE.MeshStandardMaterial({
    map: fullTexture,
    roughness: 0.85,
    metalness: 0.05,
    side: THREE.DoubleSide,
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -0.15;
  rig.add(mesh);

  // Wireframe ghost overlay for that "reconstruction" look
  const wireMat = new THREE.MeshBasicMaterial({ color: 0x35a897, wireframe: true, transparent: true, opacity: 0.12 });
  const wireMesh = new THREE.Mesh(geo, wireMat);
  wireMesh.rotation.copy(mesh.rotation);
  wireMesh.position.z = 0.01;
  rig.add(wireMesh);

  document.getElementById("loading").style.display = "none";
};
img.onerror = () => {
  document.getElementById("loading").textContent = "Could not load " + PHOTO + " — check filename.";
};
img.src = PHOTO;

let isDragging = false, isPanning = false, prevX = 0, prevY = 0, rotY = 0.3, rotX = 0;
let panX = 0, panY = 0.3; // pan target — lets the viewer walk through the scene, not just spin around it
let camDist = 5.2, camDistCurrent = 9.5; // starts further back, eases in to camDist — gives a slow "arriving at the site" dolly-in instead of an instant pop

renderer.domElement.addEventListener("contextmenu", e => e.preventDefault()); // allow right-click drag for pan

renderer.domElement.addEventListener("mousedown", e => {
  if (e.button === 2 || e.shiftKey) { isPanning = true; } else { isDragging = true; }
  prevX = e.clientX; prevY = e.clientY;
});
window.addEventListener("mouseup", () => { isDragging = false; isPanning = false; });
window.addEventListener("mousemove", e => {
  if (isPanning) {
    panX -= (e.clientX - prevX) * 0.01;
    panY += (e.clientY - prevY) * 0.01;
    panY = Math.max(-1.5, Math.min(2.5, panY));
    prevX = e.clientX; prevY = e.clientY;
    return;
  }
  if (!isDragging) return;
  rotY += (e.clientX - prevX) * 0.006;
  rotX += (e.clientY - prevY) * 0.006;
  rotX = Math.max(-0.6, Math.min(0.6, rotX));
  prevX = e.clientX; prevY = e.clientY;
});
renderer.domElement.addEventListener("wheel", e => {
  camDist = Math.max(2.5, Math.min(9, camDist + e.deltaY * 0.006));
});

function animate() {
  requestAnimationFrame(animate);
  rig.rotation.y = rotY;
  camera.position.x = panX;
  camDistCurrent += (camDist - camDistCurrent) * 0.05; // eased zoom, also drives the intro dolly-in
  camera.position.z = camDistCurrent;
  camera.position.y = 3.2 - rotX * 3;
  camera.lookAt(panX, panY, 0);
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
